<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .skeleton {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  </defs>
  
  <!-- Background gradient -->
  <rect width="1200" height="675" fill="url(#grad)"/>
  
  <!-- Skeleton content -->
  <g class="skeleton">
    <!-- Header bar -->
    <rect x="50" y="50" width="1100" height="80" rx="8" fill="#2d3561" opacity="0.4"/>
    
    <!-- Title -->
    <rect x="50" y="160" width="800" height="40" rx="8" fill="#d4af37" opacity="0.3"/>
    
    <!-- Description lines -->
    <rect x="50" y="230" width="1100" height="20" rx="4" fill="#555" opacity="0.2"/>
    <rect x="50" y="270" width="900" height="20" rx="4" fill="#555" opacity="0.2"/>
    
    <!-- Tech stack -->
    <rect x="50" y="340" width="150" height="30" rx="6" fill="#d4af37" opacity="0.2"/>
    <rect x="220" y="340" width="150" height="30" rx="6" fill="#d4af37" opacity="0.2"/>
    <rect x="390" y="340" width="150" height="30" rx="6" fill="#d4af37" opacity="0.2"/>
    
    <!-- Footer -->
    <rect x="50" y="430" width="200" height="40" rx="8" fill="#d4af37" opacity="0.2"/>
    
    <!-- Center icon -->
    <circle cx="600" cy="400" r="40" fill="#d4af37" opacity="0.15"/>
    <text x="600" y="410" font-size="50" text-anchor="middle" fill="#d4af37" opacity="0.2">⚙</text>
  </g>
  
  <!-- "Coming Soon" text -->
  <text x="600" y="600" font-size="48" font-weight="bold" text-anchor="middle" fill="#d4af37" opacity="0.6">جاري الإنشاء</text>
</svg>
